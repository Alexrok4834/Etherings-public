[package]
name = "silver-marketplace-alpha"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
bincode = "=1.3.3"
solana-program = "=2.3.0"
spl-token-2022 = { version = "=8.0.1", default-features = false, features = ["no-entrypoint"] }
spl-transfer-hook-interface = "=0.10.0"
spl-tlv-account-resolution = "=0.10.0"
silver-first-entry-alpha = { path = "../silver-first-entry", default-features = false, features = ["no-entrypoint", "local-opening-proof"] }
